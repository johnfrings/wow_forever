<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Talent Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <p class="eyebrow" id="eyebrow">World of Warcraft: Forever</p>
      <h1 id="title">Talent Calculator</h1>
    </header>

    <main id="app" aria-live="polite">
      <p class="loading">Loading talent data…</p>
    </main>

    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

    <noscript><p class="loading">This calculator needs JavaScript enabled.</p></noscript>
  </body>
</html>
